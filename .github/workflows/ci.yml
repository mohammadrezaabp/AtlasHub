name: Build, test and scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Check publication boundaries
        shell: pwsh
        run: ./scripts/Test-PublishSafety.ps1
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          release=v8.30.1
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          directory=$(mktemp -d)
          cd "$directory"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/$release/gitleaks_8.30.1_checksums.txt" --output checksums.txt
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$directory/gitleaks" git --redact --no-banner
      - run: dotnet restore AtlasHub.slnx
      - run: dotnet build AtlasHub.slnx --configuration Release --no-restore
      - run: dotnet test AtlasHub.slnx --configuration Release --no-build --no-restore
      - run: dotnet format AtlasHub.slnx --verify-no-changes --no-restore --verbosity quiet
      - name: Audit direct and transitive packages
        shell: pwsh
        run: |
          $output = dotnet list AtlasHub.slnx package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw 'Package audit failed.' }
          $audit = ($output -join "`n") | ConvertFrom-Json
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities.Count -gt 0) { throw "Vulnerable package: $($package.id) $($package.resolvedVersion)" }
              }
            }
          }
